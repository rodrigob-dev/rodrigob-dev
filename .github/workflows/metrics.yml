name: metrics
on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate languages card
        run: python .github/scripts/gen_languages.py
        env:
          GH_TOKEN: ${{ secrets.METRICS2 }}
          GH_USER: rodrigob-dev
      - name: Commit languages card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/languages.svg
          git diff --staged --quiet || git commit -m "chore: update languages card"
          git push
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS2 }}
          user: rodrigob-dev
          filename: profile/metrics.svg
          base: header, activity, repositories
          # Without this, the commit count falls back to the commit-search index,
          # which is approximate over private repos: it reported 6, 49, 180, 185
          # and 327 on consecutive days for the same ~185 commits.
          base_indepth: yes
          config_timezone: America/Sao_Paulo
          output_action: commit
          committer_branch: main
