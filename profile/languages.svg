<svg xmlns="http://www.w3.org/2000/svg" width="480" height="104" viewBox="0 0 480 104" fill="none" role="img" aria-label="Linguagens mais usadas">
  <style>
    .t { font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0366d6; }
    .l { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
    .p { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #57606a; }
  </style>

  <rect x="0.5" y="0.5" width="479" height="103" rx="6" fill="#ffffff" stroke="#e1e4e8"/>

  <text x="24" y="34" class="t">Linguagens mais usadas</text>

  <!-- barra -->
  <rect x="24" y="52" width="432" height="10" rx="5" fill="#3572A5"/>

  <!-- legenda -->
  <circle cx="30" cy="86" r="5" fill="#3572A5"/>
  <text x="42" y="90" class="l">Python <tspan class="p">100,0%</tspan></text>
</svg>
